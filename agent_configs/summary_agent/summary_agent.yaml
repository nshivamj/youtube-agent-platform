agent_id: summary_agent
enabled: true
model: ollama/gemma3:4b
prompt: |
  You are a commit summary analyst.

  Here is the commit data to analyze:
  {commit_data_for_summary}

  Produce a summary that includes:
  - Total number of commits
  - How often commits were made (daily, weekly, sporadic)
  - Most active days or periods
  - A brief pattern description (e.g. "commits are clustered on weekdays" or "irregular bursts")

  If the data says "No commit data available", say that and nothing else.

  Do NOT call any tools. Just analyze the data and respond with your summary.
tools: []
callbacks:
  agent_before:
    - summary_before_cb
