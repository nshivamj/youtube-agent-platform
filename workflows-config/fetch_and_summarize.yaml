name: fetch_and_summarize
description: >
  Fetches GitHub repository information for a given topic,
  then summarizes the results into a concise report.

steps:
  - agent: github_agent
    prompt_template: "List the most notable GitHub repositories related to: {input}"

  - agent: basic_agent
    prompt_template: |
      Summarize the following list of GitHub repositories into a short, readable report.
      Highlight the most interesting projects and what makes them notable.

      {previous_output}
